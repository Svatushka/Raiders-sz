<!DOCTYPE html>
<html lang="ru" data-theme="cyberpunk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Сектор потерян | [FSBP]</title>

    
    <base href="/Raiders-sz/">

    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#050508">

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="images/okno.png?v=4">
    <link rel="icon" type="image/png" sizes="16x16" href="images/okno.png?v=4">
    <link rel="apple-touch-icon" href="images/okno.png?v=4">
    <link rel="shortcut icon" href="images/okno.png?v=4">

    <!-- Шрифты и CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <!-- Загрузка темы ДО рендера, чтобы не мигало -->
    <script>
    (function () {
        try {
            var saved = localStorage.getItem('fsbp_theme') || 'cyberpunk';
            document.documentElement.setAttribute('data-theme', saved);
        } catch (e) {}
    })();
    </script>

    <!-- Локальные стили для страницы 404 -->
    <style>
        .error-wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            position: relative;
            z-index: 1;
        }
        .error-terminal {
            text-align: center;
            max-width: 560px;
            width: 100%;
        }
        .error-code {
            font-family: 'Share Tech Mono', monospace;
            font-size: clamp(3.5rem, 14vw, 6rem);
            letter-spacing: 12px;
            line-height: 1;
            margin-bottom: 15px;
        }
        .error-title {
            font-family: 'Share Tech Mono', monospace;
            color: var(--neon-pink);
            font-size: 1.4rem;
            letter-spacing: 3px;
            margin-bottom: 18px;
            text-shadow: 0 0 10px var(--neon-pink);
        }
        .error-text {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 10px;
            color: var(--text-color);
        }
        .error-hint {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.8rem;
            color: var(--neon-blue);
            opacity: 0.7;
            margin-bottom: 28px;
            letter-spacing: 1px;
        }
        .error-back {
            display: inline-block;
            padding: 12px 28px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--stalker-green);
            border: 2px solid var(--stalker-green);
            text-decoration: none;
            transition: all 0.3s;
            box-shadow: inset 0 0 10px rgba(var(--stalker-green-rgb), 0.12);
        }
        .error-back:hover {
            background: var(--stalker-green);
            color: #000;
            box-shadow: 0 0 16px rgba(var(--stalker-green-rgb), 0.7);
        }
        @media (max-width: 768px) {
            .error-code { letter-spacing: 8px; }
            .error-title { font-size: 1.1rem; }
            .error-text { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div id="scroll-progress"></div>

    <div class="cursor-dot"></div>
    <div class="cursor-ring"></div>

    <nav class="main-nav" aria-label="Основная навигация">
        <a href="./">Главная</a>
        <a href="roster.html">Состав</a>
        <a href="gallery.html">Галерея</a>
    </nav>

    <div class="theme-switcher" role="group" aria-label="Смена темы">
        <button data-theme="cyberpunk" class="theme-btn active" title="Киберпанк" aria-label="Киберпанк"></button>
        <button data-theme="stalker" class="theme-btn" title="Сталкер" aria-label="Сталкер"></button>
        <button data-theme="matrix" class="theme-btn" title="Матрица" aria-label="Матрица"></button>
    </div>

    <main class="error-wrap">
        <!-- Класс glitch-text берет стили из основного style.css -->
        <div class="terminal-border error-terminal">
            <div class="error-code glitch-text">404</div>
            <h2 class="error-title">&gt; ОШИБКА 404</h2>
            <p class="error-text">Сектор не найден. Аномалия поглотила страницу.</p>
            <p class="error-hint">// проверьте координаты или вернитесь в штаб</p>
            <a href="./" class="error-back">← Вернуться в штаб</a>
        </div>
    </main>

    <!-- Подключаем общий скрипт для работы курсора, тем и прогресс-бара -->
    <script src="script.js"></script>
</body>
</html>
